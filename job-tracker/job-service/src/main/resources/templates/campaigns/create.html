<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>New Cold Mail Campaign</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/jobs">🎯 Job Tracker</a>
    <a href="/campaigns" class="btn btn-outline-light btn-sm">← Back</a>
</nav>

<div class="container mt-4" style="max-width: 800px;">
    <h4 class="mb-4">📧 New Cold Mail Campaign</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/campaigns}" th:object="${campaignDto}" method="post">

        <!-- Campaign Info -->
        <div class="card mb-3">
            <div class="card-header">Campaign Info</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company (optional)</label>
                        <input type="text" class="form-control" th:field="*{company}" placeholder="e.g. Flipkart"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role (optional)</label>
                        <input type="text" class="form-control" th:field="*{jobRole}" placeholder="e.g. SDE-2 Backend"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email Subject *</label>
                        <input type="text" class="form-control" th:field="*{subject}"
                               placeholder="e.g. Application for SDE-2 Backend Role — Java Developer"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Email Body -->
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between">
                <span>Email Body *</span>
                <span class="text-muted small">Use <code>{hrName}</code> to personalise per HR</span>
            </div>
            <div class="card-body">
                <textarea class="form-control" th:field="*{body}" rows="10"
                          placeholder="Dear {hrName},&#10;&#10;I hope this email finds you well. I am writing to express my interest in the SDE-2 Backend role at your company...&#10;&#10;Best regards,&#10;Your Name"></textarea>
                <div class="text-danger small" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
                <div class="text-muted small mt-1">💡 <code>{hrName}</code> will be automatically replaced with each HR's name when sending.</div>
            </div>
        </div>

        <!-- HR Recipients -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>HR Recipients (up to 10)</span>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRecipient()">+ Add HR</button>
            </div>
            <div class="card-body">
                <div id="recipients-container">
                    <!-- Row 1 (default) -->
                    <div class="row g-2 mb-2 recipient-row">
                        <div class="col-md-4">
                            <input type="text" name="hrNames" class="form-control form-control-sm" placeholder="HR Name"/>
                        </div>
                        <div class="col-md-6">
                            <input type="email" name="hrEmails" class="form-control form-control-sm" placeholder="hr@company.com"/>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="removeRow(this)">Remove</button>
                        </div>
                    </div>
                </div>
                <div class="text-muted small mt-2">All emails will be sent individually — not as CC/BCC.</div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-5">
            <button type="submit" class="btn btn-primary">
                Send Campaign
            </button>
            <a href="/campaigns" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let count = 1;

    function addRecipient() {
        if (count >= 10) {
            alert('Maximum 10 recipients allowed.');
            return;
        }
        count++;
        const container = document.getElementById('recipients-container');
        const row = document.createElement('div');
        row.className = 'row g-2 mb-2 recipient-row';
        row.innerHTML = `
            <div class="col-md-4">
                <input type="text" name="hrNames" class="form-control form-control-sm" placeholder="HR Name"/>
            </div>
            <div class="col-md-6">
                <input type="email" name="hrEmails" class="form-control form-control-sm" placeholder="hr@company.com"/>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="removeRow(this)">Remove</button>
            </div>`;
        container.appendChild(row);
    }

    function removeRow(btn) {
        btn.closest('.recipient-row').remove();
        count--;
    }
</script>
</body>
</html>
