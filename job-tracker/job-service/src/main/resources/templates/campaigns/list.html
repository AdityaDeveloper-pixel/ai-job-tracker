<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Cold Mail Campaigns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/jobs">🎯 Job Tracker</a>
    <div class="d-flex gap-2">
        <a href="/jobs" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/campaigns/new" class="btn btn-success btn-sm">+ New Campaign</a>
    </div>
</nav>

<div class="container mt-4">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">📧 Cold Mail Campaigns</h4>
        <a href="/campaigns/new" class="btn btn-primary btn-sm">+ New Campaign</a>
    </div>

    <div th:if="${campaigns.isEmpty()}" class="text-center py-5 text-muted">
        No campaigns yet. <a href="/campaigns/new">Create your first cold mail campaign!</a>
    </div>

    <div th:each="c : ${campaigns}" class="card mb-3 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h6 class="mb-1 fw-bold" th:text="${c.subject}"></h6>
                    <div class="text-muted small">
                        <span th:if="${c.company}" th:text="${c.company + ' · '}"></span>
                        <span th:if="${c.jobRole}" th:text="${c.jobRole + ' · '}"></span>
                        <span th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></span>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <!-- Stats badges -->
                    <span class="badge bg-secondary" th:text="${c.recipients.size() + ' recipients'}"></span>
                    <span class="badge bg-success"
                          th:text="${#aggregates.sum(c.recipients.![sent ? 1 : 0]) + ' sent'}"></span>
                    <span class="badge bg-info text-dark"
                          th:text="${#aggregates.sum(c.recipients.![opened ? 1 : 0]) + ' opened'}"></span>
                    <span class="badge bg-warning text-dark"
                          th:text="${#aggregates.sum(c.recipients.![replied ? 1 : 0]) + ' replied'}"></span>
                    <a th:href="'/campaigns/' + ${c.id}" class="btn btn-sm btn-outline-primary">View</a>
                    <form th:action="'/campaigns/' + ${c.id} + '/delete'" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this campaign?')">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
