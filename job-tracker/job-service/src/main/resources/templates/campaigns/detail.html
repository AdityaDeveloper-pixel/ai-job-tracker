<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Campaign Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/jobs">🎯 Job Tracker</a>
    <a href="/campaigns" class="btn btn-outline-light btn-sm">← Back to Campaigns</a>
</nav>

<div class="container mt-4">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Campaign header -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold" th:text="${campaign.subject}"></h5>
            <div class="text-muted small mb-3">
                <span th:if="${campaign.company}" th:text="${campaign.company + ' · '}"></span>
                <span th:if="${campaign.jobRole}" th:text="${campaign.jobRole + ' · '}"></span>
                Sent on <span th:text="${#temporals.format(campaign.createdAt, 'dd MMM yyyy HH:mm')}"></span>
            </div>

            <!-- Summary stats -->
            <div class="row g-3">
                <div class="col-6 col-md-3">
                    <div class="border rounded p-3 text-center">
                        <div class="fs-4 fw-bold text-secondary"
                             th:text="${campaign.recipients.size()}">0</div>
                        <div class="small text-muted">Total</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="border rounded p-3 text-center">
                        <div class="fs-4 fw-bold text-success"
                             th:text="${#aggregates.sum(campaign.recipients.![sent ? 1 : 0])}">0</div>
                        <div class="small text-muted">Sent</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="border rounded p-3 text-center">
                        <div class="fs-4 fw-bold text-info"
                             th:text="${#aggregates.sum(campaign.recipients.![opened ? 1 : 0])}">0</div>
                        <div class="small text-muted">Opened</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="border rounded p-3 text-center">
                        <div class="fs-4 fw-bold text-warning"
                             th:text="${#aggregates.sum(campaign.recipients.![replied ? 1 : 0])}">0</div>
                        <div class="small text-muted">Replied</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Per HR tracking table -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">Per HR Tracking</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>HR Name</th>
                        <th>Email</th>
                        <th>Delivery</th>
                        <th>Opened</th>
                        <th>Replied</th>
                        <th>Sent At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${campaign.recipients}">
                        <td th:text="${r.hrName}"></td>
                        <td><a th:href="'mailto:' + ${r.hrEmail}" th:text="${r.hrEmail}"></a></td>
                        <td>
                            <span th:if="${r.deliveryStatus == 'SENT'}" class="badge bg-success">✔ Sent</span>
                            <span th:if="${r.deliveryStatus == 'FAILED'}" class="badge bg-danger"
                                  th:title="${r.failureReason}">✗ Failed</span>
                            <span th:if="${r.deliveryStatus == 'PENDING'}" class="badge bg-secondary">Pending</span>
                        </td>
                        <td>
                            <span th:if="${r.opened}" class="text-success fw-semibold">
                                ✔ Yes
                                <div class="text-muted small"
                                     th:text="${#temporals.format(r.openedAt, 'dd MMM HH:mm')}"></div>
                            </span>
                            <span th:if="${!r.opened}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:if="${r.replied}" class="text-warning fw-semibold">
                                ✔ Yes
                                <div class="text-muted small"
                                     th:text="${#temporals.format(r.repliedAt, 'dd MMM HH:mm')}"></div>
                            </span>
                            <span th:if="${!r.replied}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:if="${r.sentAt != null}"
                                  th:text="${#temporals.format(r.sentAt, 'dd MMM HH:mm')}"></span>
                            <span th:if="${r.sentAt == null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <form th:if="${!r.replied}"
                                  th:action="'/campaigns/recipients/' + ${r.id} + '/replied'"
                                  method="post" class="d-inline">
                                <input type="hidden" name="campaignId" th:value="${campaign.id}"/>
                                <button class="btn btn-sm btn-outline-warning">Mark Replied</button>
                            </form>
                            <span th:if="${r.replied}" class="text-muted small">Replied ✔</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Email body preview -->
    <div class="card mb-4">
        <div class="card-header">Email Body Sent</div>
        <div class="card-body">
            <pre style="white-space:pre-wrap;font-size:0.85rem" th:text="${campaign.body}"></pre>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
